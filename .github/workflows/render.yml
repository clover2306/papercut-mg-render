name: Render MG papercut

# Render komposisi MGA-MGK UMP (1280x720, 30fps) dalam potongan paralel,
# lalu gabungkan tiap MG jadi satu video. Video hasil TIDAK bersuara:
# potongan narasi digabung secara lokal oleh Clover (audio tidak masuk repo).
# Input mgs memungkinkan render ulang sebagian MG saja.
on:
  workflow_dispatch:
    inputs:
      mgs:
        description: 'MG ids, comma-separated (default: all 11 UMP)'
        required: false
        default: 'MGA,MGB,MGC,MGD,MGE,MGF,MGG,MGH,MGI,MGJ,MGK'

jobs:
  plan:
    name: Plan matrices
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.mk.outputs.render }}
      stitch: ${{ steps.mk.outputs.stitch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute frame ranges
        id: mk
        env:
          MGS: ${{ inputs.mgs }}
        run: |
          python3 - <<'EOF'
          import json, os
          mgs = [m.strip() for m in os.environ["MGS"].split(",") if m.strip()]
          durs = json.load(open("mg-durations.json"))
          inc = []
          for mg in mgs:
              total = durs[mg]
              n = 6
              size = (total + n - 1) // n
              for c in range(n):
                  s = c * size
                  e = min(total, s + size) - 1
                  if s <= e:
                      inc.append({"mg": mg, "chunk": c, "start": s, "end": e})
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write("render=" + json.dumps({"include": inc}) + "\n")
          out.write("stitch=" + json.dumps({"include": [{"mg": mg} for mg in mgs]}) + "\n")
          out.close()
          EOF

  render:
    name: Render ${{ matrix.mg }} chunk ${{ matrix.chunk }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.render) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Chrome system deps (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcb1 libxkbcommon0 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render frame chunk
        run: |
          echo "${{ matrix.mg }} chunk ${{ matrix.chunk }}: frames ${{ matrix.start }}-${{ matrix.end }}"
          npx remotion render ${{ matrix.mg }} chunk-${{ matrix.mg }}-${{ matrix.chunk }}.mp4 --frames=${{ matrix.start }}-${{ matrix.end }} --log=error

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.mg }}-${{ matrix.chunk }}
          path: chunk-${{ matrix.mg }}-${{ matrix.chunk }}.mp4
          retention-days: 2

  stitch:
    name: Stitch ${{ matrix.mg }}
    needs: [plan, render]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.stitch) }}
    steps:
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ matrix.mg }}-*
          path: chunks

      - name: Ensure ffmpeg
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Concatenate
        run: |
          for i in 0 1 2 3 4 5; do echo "file 'chunks/chunk-${{ matrix.mg }}-$i/chunk-${{ matrix.mg }}-$i.mp4'" >> list.txt; done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -pix_fmt yuv420p -crf 18 ${{ matrix.mg }}.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 ${{ matrix.mg }}.mp4

      - name: Upload final video (silent, narration is muxed locally)
        uses: actions/upload-artifact@v4
        with:
          name: mg-${{ matrix.mg }}-video
          path: ${{ matrix.mg }}.mp4
          retention-days: 30
