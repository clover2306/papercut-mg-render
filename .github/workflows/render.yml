name: Render MG Contoh

# Render komposisi ContohMG (519 frame, 1280x720, 30fps) dalam 6 potongan
# paralel, lalu digabung jadi satu video. Video hasil TIDAK bersuara:
# potongan narasi digabung secara lokal oleh Clover (audio tidak masuk repo).
on:
  workflow_dispatch:

jobs:
  render:
    name: Render chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Chrome system deps (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcb1 libxkbcommon0 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render frame chunk
        run: |
          TOTAL=519
          CHUNKS=6
          SIZE=$(( (TOTAL + CHUNKS - 1) / CHUNKS ))
          START=$(( ${{ matrix.chunk }} * SIZE ))
          END=$(( START + SIZE - 1 ))
          if [ "$END" -ge "$TOTAL" ]; then END=$(( TOTAL - 1 )); fi
          echo "chunk ${{ matrix.chunk }}: frames $START-$END"
          npx remotion render ContohMG chunk-${{ matrix.chunk }}.mp4 --frames=$START-$END --log=error

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: chunk-${{ matrix.chunk }}.mp4
          retention-days: 7

  stitch:
    name: Stitch chunks
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks

      - name: Ensure ffmpeg
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Concatenate
        run: |
          for i in 0 1 2 3 4 5; do echo "file 'chunks/chunk-$i/chunk-$i.mp4'" >> list.txt; done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -pix_fmt yuv420p -crf 18 contoh-mg-video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 contoh-mg-video.mp4

      - name: Upload final video (silent, narration is muxed locally)
        uses: actions/upload-artifact@v4
        with:
          name: contoh-mg-video
          path: contoh-mg-video.mp4
          retention-days: 30
