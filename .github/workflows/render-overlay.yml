name: Render caption overlay (transparent)

# Render CaptionOverlay (1280x720, 30fps, 16855 frames) as PNG sequences
# in 6 parallel chunks, then encode each chunk to QTRLE .mov (alpha).
# QTRLE is the alpha path: VP8/VP9 silently drop the alpha plane in
# ffmpeg/libvpx (verified 2026-11-15), while QTRLE preserves it.
# Chunks are concatenated locally by Clover (concat copy) and overlaid
# onto the caption-free video with ffmpeg. No stitch job here on purpose.
on:
  workflow_dispatch:

jobs:
  plan:
    name: Plan matrices
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.mk.outputs.render }}
    steps:
      - name: Compute frame ranges
        id: mk
        run: |
          python3 - <<'EOF'
          import json, os
          total = 17458
          n = 6
          size = (total + n - 1) // n
          inc = []
          for c in range(n):
              s = c * size
              e = min(total, s + size) - 1
              if s <= e:
                  inc.append({"chunk": c, "start": s, "end": e, "count": e - s + 1})
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write("render=" + json.dumps({"include": inc}) + "\n")
          out.close()
          EOF

  render:
    name: Render overlay chunk ${{ matrix.chunk }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.render) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Chrome system deps (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcb1 libxkbcommon0 libatspi2.0-0 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Ensure ffmpeg
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Render PNG frames
        run: |
          echo "overlay chunk ${{ matrix.chunk }}: frames ${{ matrix.start }}-${{ matrix.end }} (${{ matrix.count }} frames)"
          node tools/render-overlay-frames.mjs ${{ matrix.start }} ${{ matrix.end }} frames-${{ matrix.chunk }} 4
          ls frames-${{ matrix.chunk }} | wc -l
          echo "first files:"; ls frames-${{ matrix.chunk }} | head -5
          echo "last files:"; ls frames-${{ matrix.chunk }} | tail -2

      - name: Encode QTRLE chunk (alpha)
        run: |
          # Normalize frame filenames: chunks 0 and 3 failed twice with
          # ffmpeg image2 finding no element-%d.png although 2808 files
          # were listed (cause unconfirmed on the runner; local repro
          # with the same Remotion version works). Version-sort the PNGs
          # and rename sequentially so the encode cannot depend on the
          # original naming scheme.
          i=0
          for f in $(ls frames-${{ matrix.chunk }}/*.png | sort -V); do
            printf -v n 'seq-%06d.png' $i
            mv "$f" "frames-${{ matrix.chunk }}/$n"
            i=$((i+1))
          done
          test "$i" = "${{ matrix.count }}"
          ffmpeg -y -v error -framerate 30 -start_number 0 -i frames-${{ matrix.chunk }}/seq-%06d.png -c:v qtrle -pix_fmt argb overlay-chunk-${{ matrix.chunk }}.mov
          ffprobe -v error -count_frames -show_entries stream=codec_name,pix_fmt,nb_read_frames -show_entries format=duration -of default=nw=1 overlay-chunk-${{ matrix.chunk }}.mov
          test "$(ffprobe -v error -count_frames -show_entries stream=nb_read_frames -of csv=p=0 overlay-chunk-${{ matrix.chunk }}.mov)" = "${{ matrix.count }}"

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: overlay-chunk-${{ matrix.chunk }}
          path: overlay-chunk-${{ matrix.chunk }}.mov
          retention-days: 2
